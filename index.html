<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cupid's Arrows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#120a1f;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;font-family:"Press Start 2P",monospace}
  #wrap{display:grid;grid-template-areas:"game";place-items:center;gap:14px}
  canvas{grid-area:game;display:block;image-rendering:pixelated;
    box-shadow:0 0 0 4px #2a1840,0 0 0 8px #120a1f,0 0 0 10px #ff3b6b55,0 12px 50px #000}
  .pad{display:none}

  /* ---- handheld console shell (touch devices) ---- */
  body.touch #wrap{grid-template-areas:"game game" "left right";grid-template-columns:1fr 1fr;
    padding:16px 14px 18px;border-radius:26px;
    background:linear-gradient(160deg,#4a2b70,#2a1744 60%,#1e1032);
    box-shadow:inset 0 2px 0 #7a52a8,inset 0 -4px 0 #140a22,0 14px 40px #000}
  body.touch canvas{box-shadow:0 0 0 3px #120a1f,0 0 0 6px #6b4a96}
  body.touch .pad{display:flex;align-items:center;justify-content:center;gap:16px}
  #padL{grid-area:left} #padR{grid-area:right}
  #padL,#padR{zoom:var(--k,1)}
  body.touch.side #wrap{grid-template-areas:"left game right";grid-template-columns:auto auto auto;padding:12px 18px}

  /* D-pad */
  #dpad{position:relative;width:138px;height:138px;touch-action:none}
  #dpad::before,#dpad::after{content:"";position:absolute;background:#22202c;border-radius:8px;
    box-shadow:inset 0 -4px 0 #111018,inset 0 2px 0 #3c3a4c,0 4px 0 #0c0a14}
  #dpad::before{left:46px;top:0;width:46px;height:138px}
  #dpad::after{top:46px;left:0;width:138px;height:46px}
  #dpad span{position:absolute;z-index:2;width:46px;height:46px;display:flex;align-items:center;justify-content:center;
    color:#6d6a85;font-size:14px;pointer-events:none;transition:color .05s}
  #dpad .u{left:46px;top:0} #dpad .d{left:46px;bottom:0} #dpad .l{left:0;top:46px} #dpad .r{right:0;top:46px}
  #dpad i{position:absolute;z-index:2;left:58px;top:58px;width:22px;height:22px;border-radius:50%;background:#1a1822;pointer-events:none}
  #dpad.pu .u,#dpad.pd .d,#dpad.pl .l,#dpad.pr .r{color:#ff6b93;text-shadow:0 0 8px #ff3b6b}

  /* A / B buttons */
  .btns{display:flex;gap:14px;transform:rotate(-18deg)}
  .round{width:66px;height:66px;border-radius:50%;border:0;font:inherit;font-size:18px;color:#fff;
    background:radial-gradient(circle at 35% 30%,#ff7aa0,#e0204f 60%,#9c0f33);
    box-shadow:inset 0 -5px 0 #7a0a26,0 5px 0 #0c0a14;touch-action:none;position:relative}
  .round.b{background:radial-gradient(circle at 35% 30%,#b99cff,#6c42d6 60%,#3f2290);box-shadow:inset 0 -5px 0 #2b1766,0 5px 0 #0c0a14}
  .round.down{transform:translateY(4px);box-shadow:inset 0 -2px 0 #7a0a26,0 1px 0 #0c0a14}
  .round small{position:absolute;left:50%;top:76px;transform:translateX(-50%);font-size:7px;color:#c9b8ff;white-space:nowrap}
  .side{display:flex;flex-direction:column;align-items:center;gap:26px}
  .pill{border:0;font:inherit;font-size:7px;color:#c9b8ff;background:#1a1028;padding:8px 12px;border-radius:12px;
    box-shadow:inset 0 -2px 0 #0c0716;touch-action:none}
  .pill.down{transform:translateY(2px)}
  button{cursor:pointer;outline:none} #dpad{cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="g" width="1280" height="720"></canvas>
  <div id="padL" class="pad">
    <div id="dpad"><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span><i></i></div>
  </div>
  <div id="padR" class="pad">
    <div class="side">
      <div class="btns">
        <button id="bB" class="round b">B<small>SOUND</small></button>
        <button id="bA" class="round">A<small>START</small></button>
      </div>
      <button id="bP" class="pill">PAUSE</button>
    </div>
  </div>
</div>
<script>
"use strict";
const W = 320, H = 180, FLOOR = H - 24;
const cv = document.getElementById('g'), ctx = cv.getContext('2d');
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window || location.search.includes('pad');
document.body.classList.add('touch');   // console controller is always shown (mouse, touch, or keyboard all work)
let scale = 1, R = 4;   // scale = CSS px per game pixel, R = canvas px per game pixel
function fit() {
  // controller size scales with the screen; pick the layout (pads beside vs below) that gives the biggest game
  const k = clamp(Math.min(innerWidth, innerHeight) / 520, .6, 1);
  document.documentElement.style.setProperty('--k', k);
  const sideS = Math.min((innerWidth - 24 - 2 * 160 * k - 30) / W, (innerHeight - 40) / H);
  const stackS = Math.min((innerWidth - 40) / W, (innerHeight - 40 - 190 * k) / H);
  const side = sideS >= stackS;
  document.body.classList.toggle('side', side);
  scale = Math.max(.5, side ? sideS : stackS);
  cv.style.width = Math.round(W * scale) + 'px';
  cv.style.height = Math.round(H * scale) + 'px';
  const r = clamp(Math.ceil(scale * (devicePixelRatio || 1)), 2, 6);
  if (r !== R || cv.width !== W * r) { R = r; cv.width = W * R; cv.height = H * R; }
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', () => setTimeout(fit, 50));

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
fit();

/* ---------------- sprite helpers ---------------- */
function mk(w, h, f) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  f((a, b, cw, ch, col) => { x.fillStyle = col; x.fillRect(a, b, cw, ch); });
  return c;
}

/* Jensen: grey hair, glasses, black leather jacket. mood 0 normal, 1 blush, 2 in love */
function jensenSprite(f, mood) {
  return mk(16, 26, p => {
    const HA='#d9d9d9', HD='#a3a3a3', HL='#f6f6f6', SK='#e6b089', SD='#c58d66',
          G='#1d1d1d', LE='#bfe0ea', JK='#161616', JH='#3d3d3d', SH='#050505',
          PA='#262a3a', SO='#0b0b0b';
    const lo = f === 1 ? -1 : 0, ro = f === 2 ? 1 : 0;
    // legs + shoes
    p(4+lo,20,3,4,PA); p(9+ro,20,3,4,PA);
    p(3+lo,24,4,2,SO); p(9+ro,24,4,2,SO);
    // jacket torso
    p(2,11,12,10,JK);
    p(3,12,1,8,JH); p(12,12,1,8,JH);
    p(6,11,4,2,SH); p(7,13,2,6,SH);           // black tee V
    p(5,11,1,4,JH); p(10,11,1,4,JH);          // lapels
    p(9,14,1,6,'#2a2a2a');                    // zipper line
    p(2,20,12,1,'#0a0a0a');
    // arms + hands
    p(0,12,2,8,JK); p(14,12,2,8,JK); p(0,12,1,7,JH); p(15,12,1,7,JH);
    p(0,20,2,2,SK); p(14,20,2,2,SK);
    p(6,10,4,1,SD);                           // neck
    // head
    p(4,3,8,7,SK); p(3,5,1,3,SD); p(12,5,1,3,SD); p(5,9,6,1,SK);
    // hair (swept silver)
    p(4,0,8,1,HA); p(3,1,10,2,HA); p(3,3,2,2,HA); p(11,3,2,2,HA); p(5,3,6,1,HA);
    p(5,1,3,1,HL); p(9,0,2,1,HL); p(3,3,1,2,HD); p(12,3,1,2,HD); p(8,2,1,1,HD);
    // glasses
    p(3,5,4,1,G); p(9,5,4,1,G); p(7,5,2,1,G);
    p(3,6,1,2,G); p(6,6,1,2,G); p(9,6,1,2,G); p(12,6,1,2,G);
    p(4,6,2,2,LE); p(10,6,2,2,LE); p(4,6,1,1,'#ffffff'); p(10,6,1,1,'#ffffff');
    p(7,7,2,1,SD);                            // nose
    if (mood === 3) {                         // kissed: happy closed eyes, deep blush
      p(4,7,1,1,'#222'); p(5,6,1,1,'#222'); p(10,6,1,1,'#222'); p(11,7,1,1,'#222');
      p(4,8,2,1,'#ff7a90'); p(10,8,2,1,'#ff7a90');
      p(6,9,4,1,'#9b4a40');
    } else if (mood === 2) {
      p(4,6,2,2,'#ff2b5e'); p(10,6,2,2,'#ff2b5e');
      p(4,8,2,1,'#ff8fa8'); p(10,8,2,1,'#ff8fa8');
      p(6,8,4,1,'#8a3b33'); p(7,9,2,1,'#c0505a');
    } else {
      p(5,7,1,1,'#222'); p(10,7,1,1,'#222');
      p(6,9,4,1,'#9b4a40'); p(5,8,1,1,'#b5705a'); p(10,8,1,1,'#b5705a');
      if (mood === 1) { p(4,8,1,1,'#ff8fa8'); p(11,8,1,1,'#ff8fa8'); }
    }
  });
}

/* Girl: long dark hair, red qipao with gold flowers, holding a bow */
/* mode: 0 aiming, 1 pulling the string, 2 in love (bow dropped, hands clasped), 3 kiss (leaning in) */
function girlSprite(mode) {
  const pull = mode === 1;
  return mk(24, 30, p0 => {
    const HR='#3b2016', HH='#6a3a24', SK='#f4cdb0', SD='#d9a585', RD='#cf1f2b',
          RK='#8f121b', GO='#f3b63f', GL='#ffe39a', WD='#8a4b23', ST='#f5f0e6', EY='#2a1610';
    const hx = mode === 3 ? 1 : 0, hy = mode === 3 ? 2 : 0;
    let p = p0;                                    // body uses p0; head uses the leaning offset
    const q = (x, y, w, h, c) => p0(x + hx, y + hy, w, h, c);
    // long back hair
    p(2,4,4,15,HR); p(3,19,2,2,HR); p(3,6,1,10,HH);
    // legs + shoes
    p(6,26,2,3,SK); p(9,26,2,3,SK); p(5,29,3,1,RK); p(9,29,3,1,RK);
    // qipao
    p(4,11,8,12,RD); p(3,20,10,6,RD);
    p(4,12,1,13,RK); p(11,20,1,6,RK);
    p(6,10,5,1,RK); p(7,10,3,1,GO);           // mandarin collar
    p(10,12,1,1,GO);                           // frog button
    for (const [fx, fy] of [[6,14],[9,18],[6,22],[10,24],[8,15]]) {
      p(fx-1,fy,1,1,GO); p(fx+1,fy,1,1,GO); p(fx,fy-1,1,1,GO); p(fx,fy+1,1,1,GO); p(fx,fy,1,1,GL);
    }
    // back arm
    p(3,12,1,7,SK); p(3,19,1,1,SD);
    // head (q = leaning offset in kiss pose)
    q(8,10,2,1,SD);
    q(5,3,7,7,SK); q(5,9,1,1,SD);
    q(5,0,7,1,HR); q(4,1,9,2,HR); q(4,3,8,1,HR); q(4,4,3,1,HR); q(4,3,2,8,HR); q(12,3,1,6,HR);
    q(6,1,3,1,HH); q(10,2,2,1,HH);
    q(4,2,2,2,'#ff5a7a'); q(5,2,1,1,'#ffd0dc');  // hair flower
    // face
    q(7,5,2,1,HR); q(10,5,2,1,HR);
    if (mode >= 2) {                           // happy closed eyes + big blush
      q(7,7,1,1,EY); q(8,6,1,1,EY); q(10,6,1,1,EY); q(11,7,1,1,EY);
      q(7,8,1,1,'#ff7a90'); q(10,8,2,1,'#ff7a90');
      if (mode === 3) { q(10,9,2,1,'#d23a4a'); q(12,9,1,1,'#ff5a6a'); }   // pucker
      else { q(8,9,3,1,'#d23a4a'); }
    } else {
      q(8,6,1,2,EY); q(10,6,1,2,EY);
      q(7,8,1,1,'#f59aa2'); q(11,8,1,1,'#f59aa2');
      q(9,9,2,1,'#d23a4a');
    }
    q(6,8,1,2,GO);                             // earring
    if (mode === 2) { p(8,13,4,2,SK); p(9,12,2,1,SK); return; }        // hands clasped at chest
    if (mode === 3) { p(11,12,5,2,SK); p(15,11,1,1,SK); return; }      // arm around him
    // bow
    p(16,6,1,1,WD); p(17,7,1,12,WD); p(16,19,1,1,WD); p(17,12,1,2,'#c78a4f');
    if (pull) {
      p(16,7,1,1,ST); p(15,8,1,2,ST); p(14,10,1,2,ST); p(13,12,1,2,ST);
      p(14,14,1,2,ST); p(15,16,1,2,ST); p(16,18,1,1,ST);
      p(13,12,8,1,WD);                         // nocked arrow
      p(20,11,1,1,'#ff3b6b'); p(22,11,1,1,'#ff3b6b'); p(20,12,3,1,'#ff3b6b'); p(21,13,1,1,'#ff3b6b');
      p(12,11,1,1,'#ff9ec4'); p(12,13,1,1,'#ff9ec4');
      p(11,12,3,2,SK);                         // pulling hand
      p(15,12,2,2,SK);
    } else {
      p(16,7,1,12,ST);
      p(11,12,6,2,SK);                         // arm extended to grip
    }
  });
}

const JCACHE = {};
const jensen = (f, m) => JCACHE[f + '_' + m] || (JCACHE[f + '_' + m] = jensenSprite(f, m));
const GIRL = [girlSprite(0), girlSprite(1), girlSprite(2), girlSprite(3)];

const GPU = mk(12, 10, p => {
  p(0,2,12,1,'#9aa'); p(0,5,12,1,'#9aa'); p(0,8,12,1,'#9aa');
  p(1,0,10,10,'#0f2a12'); p(2,1,8,8,'#76b900'); p(3,2,6,6,'#3f6a00');
  p(4,3,4,4,'#9be22d'); p(5,4,2,2,'#e9ffc4');
});
const ICE = mk(10, 10, p => {
  p(1,1,8,8,'#7fd3f7'); p(0,2,10,6,'#7fd3f7'); p(2,0,6,10,'#7fd3f7');
  p(2,2,6,6,'#bff0ff'); p(2,2,3,1,'#fff'); p(2,3,1,2,'#fff'); p(6,6,2,2,'#5ab8e6');
});

/* Trump: golden swoop, navy suit, extra-long red tie, pointing hand */
function trumpSprite(talk) {
  return mk(16, 27, p => {
    const HA='#f2c14e', HD='#c9962a', HL='#ffe592', SK='#f0a35e', SD='#d4844a', PALE='#f8d2ac',
          NV='#1f2a4d', NL='#33406e', ND='#141b33', RD='#d0202e', RK='#9c1420', WH='#f4f4f4';
    p(4,21,3,4,ND); p(9,21,3,4,ND); p(3,25,4,2,'#0d0d0d'); p(9,25,4,2,'#0d0d0d');
    p(2,11,12,10,NV); p(3,12,1,8,NL);
    p(6,11,4,3,WH); p(7,14,2,1,WH);
    p(5,11,1,4,NL); p(10,11,1,4,NL);
    p(7,11,2,1,RK); p(7,12,2,11,RD); p(8,12,1,11,RK);   // the long tie
    p(11,13,1,1,'#ff4040');                              // flag pin
    p(0,12,2,8,NV); p(0,20,2,2,SK);
    p(14,7,2,7,NV); p(14,5,2,2,SK); p(15,3,1,2,SK);      // pointing hand
    p(6,10,4,1,SD);
    p(4,3,8,7,SK); p(3,5,1,3,SD); p(12,5,1,3,SD);
    p(5,5,2,2,PALE); p(9,5,2,2,PALE);
    p(6,6,1,1,'#2a2a2a'); p(9,6,1,1,'#2a2a2a');
    p(5,4,2,1,HD); p(9,4,2,1,HD);
    p(7,7,2,1,SD);
    if (talk) p(7,8,2,2,'#7a2a20'); else { p(6,8,4,1,'#a8483a'); p(7,8,2,1,'#c0604a'); }
    p(4,0,9,1,HA); p(2,1,12,2,HA); p(2,3,3,2,HA); p(11,3,3,1,HA); p(13,2,2,2,HA);
    p(5,1,6,1,HL); p(2,3,1,2,HD); p(4,0,2,1,HD);
  });
}
const TRUMP = [trumpSprite(false), trumpSprite(true)];
const PHONE = mk(8, 12, p => {
  p(0,0,8,12,'#222'); p(1,1,6,8,'#5fe08a'); p(3,10,2,1,'#888');
  p(2,3,4,1,'#fff'); p(3,5,2,2,'#fff');
});
const JACKET = mk(12, 10, p => {
  p(2,0,8,10,'#161616'); p(0,1,2,7,'#161616'); p(10,1,2,7,'#161616');
  p(5,0,2,5,'#050505'); p(4,0,1,4,'#555'); p(7,0,1,4,'#555'); p(3,2,1,6,'#3d3d3d'); p(9,2,1,6,'#3d3d3d');
});
const PICK_SPR = { gpu: GPU, ice: ICE, phone: PHONE, jacket: JACKET };

/* ---------------- lines ---------------- */
const LINES = {
  hit: ["MY ONLY AFFAIR IS WITH GPUS!", "MY HEART IS NOT OPEN SOURCE!", "THE MORE YOU LOVE, THE MORE YOU PAY",
        "NOT IN FRONT OF THE BOARD!", "I'M MARRIED TO MY JACKET!", "MY WIFE IS ON X!", "DELETE THIS PHOTO!"],
  dodge: ["NOT TODAY, CUPID!", "ACCELERATED DODGE!", "THE MORE YOU DODGE, THE MORE YOU SAVE!",
          "CUDA CORES ENGAGED!", "LOW LATENCY, BABY!", "TOO FAST FOR LOVE!"],
  // her: sweet-talk + love-trap lines (while shooting)
  girl: ["NOTICE ME, JENSEN! ♥", "ONE MORE CHIP, DARLING", "MY HEART RUNS ON CUDA", "SIGN MY HEART TOO!",
         "JUST ONE H100 OF LOVE", "NICE JACKET ♥",
         "YOU HAD ME AT BLACKWELL ♥", "ARE YOU A GPU? MY HEART RUNS HOT", "MY LOVE HAS MORE CORES THAN AN H100",
         "LET'S TRAIN A MODEL TOGETHER ♥", "YOU + ME = PERFECT PARALLEL PROCESSING", "I'D WAIT IN ANY GPU QUEUE FOR YOU",
         "JUST ONE DINNER... I'LL BRING THE CHIPS ♥", "COME TO MY NIGHT MARKET, JENSEN ♥",
         "THAT JACKET WOULD LOOK BETTER ON MY CHAIR", "YOUR BOARD DOESN'T HAVE TO KNOW ♥",
         "ONE ARROW, AND YOUR HEART IS MINE", "NOBODY ESCAPES CUPID'S CUDA"],
  // her: teasing when he dodges
  tease: ["YOU CAN'T DODGE FOREVER, DARLING", "RUN ALL YOU WANT, I HAVE INFINITE COMPUTE",
          "PLAYING HARD TO GET? CUTE ♥", "EVEN YOUR GPUS OVERHEAT FOR ME"],
  // her: gloating on a hit
  gotcha: ["GOTCHA! ♥ ONE STEP CLOSER", "THE MORE YOU DODGE, THE MORE YOU FALL ♥", "DIRECT HIT! LOVE LATENCY: ZERO"],
  // her: special attack callouts
  special: { homing: "THIS ONE HAS AUTOPILOT ♥", wall: "NO EXIT FROM MY LOVE WALL!", burst: "SUPERCLUSTER OF LOVE!" },
  trumpIn: "HONOURABLE GUY! TREMENDOUS GUY!",
  trump: ["TARIFFS ON LOVE! 100%!", "NOBODY DODGES BETTER. BELIEVE ME.", "I KNOW JENSEN. GREAT GUY.",
          "WE'RE BUILDING A WALL. A LOVE WALL."],
  fired: ["YOU'RE FIRED!", "FAKE ARROW!", "SAD!", "WRONG!"],
};
const ENDINGS = ["BOARD LAUNCHES INVESTIGATION", "NVDA DOWN 8% AFTER HOURS", "LEATHER JACKET LEFT ON THE FLOOR",
  "TRUMP: STILL AN HONOURABLE GUY!", "CONGRESS WANTS A WORD NOV 18", "THE MORE YOU LOVE, THE MORE YOU PAY",
  "SHE GOT HIM! LOVE TRAP: SUCCESSFUL ♥", "JENSEN.EXE HAS STOPPED RESPONDING"];
const pick = a => a[(Math.random() * a.length) | 0];

/* ---------------- background ---------------- */
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const BG = mk(W, H, p => {
  const bands = ['#2c68c2','#3675cd','#4282d7','#4f90e0','#5c9de8','#69aaef','#79b8f4'];
  for (let y = 0; y < FLOOR; y++) {
    const fb = y / FLOOR * (bands.length - 1), i = Math.floor(fb), fr = fb - i;
    for (let x = 0; x < W; x++) {
      const th = BAYER[(y & 3) * 4 + (x & 3)] / 16;
      p(x, y, 1, 1, fr > th ? bands[Math.min(i + 1, bands.length - 1)] : bands[i]);
    }
  }
  const cloud = (cx, cy, s) => {
    p(cx, cy+2*s, 14*s, 3*s, '#a9d4f8'); p(cx+2*s, cy, 6*s, 3*s, '#a9d4f8'); p(cx+7*s, cy+s, 5*s, 2*s, '#a9d4f8');
    p(cx+3*s, cy+s, 3*s, s, '#d4ebfc'); p(cx+s, cy+3*s, 10*s, s, '#d4ebfc');
  };
  cloud(30, 30, 2); cloud(150, 22, 1); cloud(230, 45, 2); cloud(110, 70, 1); cloud(280, 95, 1);

    arrows = arrows.filter(a => !a.dead && a.x < W + 16 && a.x > -24 && a.y > -24 && a.y < H + 24 && a.age < 9);

    if ((pickT -= dt) <= 0) {
      pickT = rand(9, 14);
      pickups.push({ x: rand(140, W - 30), y: rand(30, H - 44), type: pick(['gpu', 'ice', 'phone', 'jacket']), life: 7 });
    }
    for (const k of pickups) {
      k.life -= dt;
      if (Math.abs(k.x + 5 - (P.x + 8)) < 11 && Math.abs(k.y + 5 - (P.y + 13)) < 15) {
        k.life = 0; bonus += 50;
        const fy = P.y - 6;
        if (k.type === 'gpu') { P.shield = 5; floater('GPU SHIELD!', P.x + 8, fy, '#9be22d'); SFX.pick(); }
        else if (k.type === 'ice') { love = Math.max(0, love - 35); floater('COLD SHOULDER -35%', P.x + 8, fy, '#9fe6ff'); SFX.pick(); }
        else if (k.type === 'phone') {
          G.stun = 3.5; G.pull = 0; floater('WIFE CALLING!', P.x + 8, fy, '#5fe08a');
          say('j', 'HI HONEY! JUST... CODING!', 3); SFX.ring();
        } else { P.armor = 1; floater('LEATHER JACKET!', P.x + 8, fy, '#dddddd'); say('j', 'JACKET ON. HEART OFF.', 3); SFX.pick(); }
        const cols = { gpu: '#9be22d', ice: '#9fe6ff', phone: '#5fe08a', jacket: '#888' };
        burst(k.x + 5, k.y + 5, 10, [cols[k.type], '#fff']);
      }
    }
    pickups = pickups.filter(k => k.life > 0);

    // Trump: special guest bodyguard
    trumpCD = Math.max(0, trumpCD - dt);
    if (!TR && love >= 65 && trumpCD <= 0) {
      TR = { x: W + 10, y: P.y, life: 6.5, phase: 'in', anim: 0, mid: false }; trumpCD = 40;
      say('t', LINES.trumpIn, 3); banner = { s: 'SPECIAL GUEST!', life: 2 }; SFX.trump();
    }
    if (TR) {
      TR.anim += dt * 8; TR.life -= dt;
      const tx = Math.max(108, P.x - 21);
      if (TR.phase === 'in') {
        TR.x -= 170 * dt; TR.y += (P.y - TR.y) * Math.min(1, dt * 6);
        if (TR.x <= tx) TR.phase = 'guard';
      } else if (TR.phase === 'guard') {
        TR.x += (tx - TR.x) * Math.min(1, dt * 8); TR.y += (P.y - TR.y) * Math.min(1, dt * 8);
        if (!TR.mid && TR.life < 3.5) { TR.mid = true; say('t', pick(LINES.trump), 2); }
        if (TR.life <= 0) { TR.phase = 'out'; say('t', 'SEE YOU AT THE HEARING!', 3); }
      } else { TR.x += 150 * dt; if (TR.x > W + 20) { TR = null; if (talk && talk.who === 't') talk = null; } }
    }

    // dialogue pacing: opening exchange, then keep the chatter going so a fresh quote is always on screen
    if (!scn.introA && t > .5) { scn.introA = true; talk = { who: 'g', s: "JENSEN... TONIGHT YOU'RE MINE ♥", prio: 2, age: 0 }; }
    else if (!scn.introB && t > 3) { scn.introB = true; talk = { who: 'j', s: 'NOT IF I CAN DODGE IT!', prio: 2, age: 0 }; }
    else if (scn.introB && (!talk || talk.age > 3.5)) {
      if (Math.random() < .6) say('g', pick(Math.random() < .7 ? LINES.girl : LINES.tease), 1);
      else say('j', pick(LINES.dodge), 1);
    }

    nvda *= 1 + (love < 40 ? .002 : -.003) * dt;
    if (sinceHit > 2) love = Math.max(0, love - 4 * dt);
    if (love >= 100) startFall();
  } else if (state === 'fall') {
    // LOVE TRAP: freeze -> he walks to her -> kiss -> lines -> game over
    fallT += dt;
    scn.flash = Math.max(0, scn.flash - dt);
    if (TR) {
      TR.anim += dt * 8;
      TR.x += (G.x + 32 - TR.x) * Math.min(1, dt * 2.5); TR.y += (G.y + 3 - TR.y) * Math.min(1, dt * 2.5);
    }
    if (!scn.kiss) {
      const tx = G.x + 9, ty = G.y + 4, dx = tx - P.x, dy = ty - P.y, d = Math.hypot(dx, dy);
      if (fallT > .4 && !scn.said) { scn.said = true; say('g', 'FINALLY! ♥', 3); }
      if (fallT > .8) {
        const step = Math.max(80, d * 2.2) * dt;
        if (d <= step) { P.x = tx; P.y = ty; P.moving = false; startKiss(); }
        else { P.x += dx / d * step; P.y += dy / d * step; P.anim += dt * 9; P.moving = true; }
      }
      if ((heartT -= dt) <= 0) {
        heartT = .08;
        parts.push({ x: P.x + rand(0, 16), y: P.y + rand(-2, 6), vx: rand(-10, 10), vy: rand(-45, -25), life: 1.1, max: 1.1, kind: 'heart', c: Math.random() < .5 ? '#ff3b6b' : '#ff9ec4' });
      }
    } else {
      scn.kiss += dt;
      const kx = G.x + 13, ky = G.y + 10;
      if ((heartT -= dt) <= 0) {
        heartT = .05;
        const side = Math.random() < .5 ? -1 : 1;   // spawn beside / above them so their faces stay visible
        parts.push({ x: kx + side * rand(11, 20), y: ky + rand(-12, 16), vx: side * rand(4, 16), vy: rand(-40, -20), life: 1.6, max: 1.6, kind: 'heart', c: pick(['#ff3b6b', '#ff9ec4', '#ff5c86']), nog: true });
      }
      if ((scn.emoT -= dt) <= 0) {
        scn.emoT = .22;
        parts.push({ x: kx + rand(-18, 18), y: G.y - 6 + rand(-3, 2), vx: rand(-12, 12), vy: rand(-30, -16), life: 2.2, max: 2.2, kind: 'emoji', ch: pick(EMOJI), nog: true });
      }
      // scripted lines always replace the current bubble
      if (!scn.l1 && scn.kiss > 1.2) { scn.l1 = true; talk = { who: 'j', s: '...MY GPUS WILL UNDERSTAND.', prio: 9, age: 0 }; }
      if (TR && !scn.l2 && scn.kiss > 3) { scn.l2 = true; talk = { who: 't', s: 'FAKE NEWS!', prio: 9, age: 0 }; }
      if (scn.kiss > (TR ? 4.4 : 3.3)) {
        state = 'over'; overT = 0; SFX.over();
        if (score() > best) { best = score(); try { localStorage.setItem('cupid-best', best); } catch (e) {} }
      }
    }
  } else if (state === 'over') {
    overT += dt; scn.kiss += dt;
    if ((scn.emoT -= dt) <= 0) {
      scn.emoT = .35;
      parts.push({ x: rand(110, 210), y: 140, vx: rand(-8, 8), vy: rand(-28, -16), life: 3, max: 3, kind: 'emoji', ch: pick(EMOJI), nog: true, ui: true });
    }
  }

  if (state !== 'pause') {
    for (const q of parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.nog ? -4 : 40) * dt; q.vx *= .98; }
    parts = parts.filter(q => q.life > 0);
    for (const f of floaters) { f.life -= dt * .8; f.y -= 16 * dt; }
    floaters = floaters.filter(f => f.life > 0);
    if (talk) talk.age += dt;
    if (banner && (banner.life -= dt) <= 0) banner = null;
    shake = Math.max(0, shake - dt * 20);
  }
}

/* ---------------- draw ---------------- */
function drawArrow(a) {
  const sp = Math.hypot(a.vx, a.vy) || 1, dx = a.vx / sp, dy = a.vy / sp, nx = -dy, ny = dx;
  const shaft = a.type === 'homing' ? '#ff7ad9' : a.type === 'defl' ? '#8b7d86' : '#9a5a2a';
  for (let i = 2; i < 12; i++) pix(a.x - dx * i, a.y - dy * i, shaft);
  const fx = a.x - dx * 11, fy = a.y - dy * 11;
  pix(fx + nx * 1.6, fy + ny * 1.6, '#ff9ec4'); pix(fx - nx * 1.6, fy - ny * 1.6, '#ff9ec4');
  pix(fx - dx * 1.5 + nx * 2.4, fy - dy * 1.5 + ny * 2.4, '#ffc2da'); pix(fx - dx * 1.5 - nx * 2.4, fy - dy * 1.5 - ny * 2.4, '#ffc2da');
  if (a.type === 'fast') for (let i = 13; i < 20; i += 2) pix(a.x - dx * i, a.y - dy * i, '#ffffff88');
  heart(a.x, a.y, a.type === 'defl' ? '#a89aa3' : a.type === 'homing' ? '#ff4fd0' : a.type === 'fast' ? '#ff1f45' : '#ff3b6b');
}

function drawJensen(x, y) {
  const mood = (state === 'fall' || state === 'over') ? (scn.kiss > 0 ? 3 : 2) : P.flash > 0 ? 2 : love > 55 ? 1 : 0;
  const f = P.moving ? (Math.floor(P.anim) % 2 ? 1 : 2) : 0;
  ctx.drawImage(jensen(f, mood), Math.round(x), Math.round(y + (f ? 0 : Math.round(Math.sin(clock * 3) * .5))));
}

function drawShield() {
  const cx = P.x + 8, cy = P.y + 13, r = 17;
  const blink = P.shield < 1.2 && Math.floor(clock * 10) % 2;
  if (blink) return;
  for (let i = 0; i < 40; i++) {
    const a = i / 40 * Math.PI * 2 + clock * 2;
    pix(cx + Math.cos(a) * r, cy + Math.sin(a) * (r + 2), i % 3 ? '#9be22d' : '#e9ffc4');
  }
}

function wrapText(s, n = 22) {
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    if ((line + ' ' + w).trim().length > n && line) { out.push(line); line = w; }
    else line = (line + ' ' + w).trim();
  }
  if (line) out.push(line);
  return out;
}
const BS = 6, BL = 9;   // bubble glyph size / line height (game px)
function drawBubble(s, ax, ay, col, name, hgt = 30) {
  const lines = wrapText(s.toUpperCase(), 18);
  const w = Math.max(...lines.map(l => l.length)) * BS + 7, h = lines.length * BL + 6;
  const x = Math.round(clamp(ax - w / 2, 2, W - w - 2));
  let y = Math.round(ay - h - 6), below = false;
  if (y < 22) { y = Math.round(ay + hgt + 3); below = true; }
  const tx = Math.round(clamp(ax, x + 4, x + w - 6));
  ctx.fillStyle = '#1a0b24'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  if (below) ctx.fillRect(tx - 1, y - 4, 4, 3); else ctx.fillRect(tx - 1, y + h + 1, 4, 3);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h);
  if (below) ctx.fillRect(tx, y - 3, 2, 3); else ctx.fillRect(tx, y + h, 2, 3);
  ctx.fillStyle = col; ctx.fillRect(x, y, w, 1);
  // speaker name tag
  const nw = name.length * 4 + 4;
  ctx.fillStyle = col; ctx.fillRect(x + 2, y - 5, nw, 6);
  drawStr(name, x + 4, y - 4, 4, '#ffffff');
  lines.forEach((l, i) => drawStr(l, x + 4, y + 4 + i * BL, BS, col));
}

    ctx.drawImage(TRUMP[talking ? 1 : 0], Math.round(TR.x), Math.round(TR.y + walk));

  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life * 2); txt(f.s, f.x, f.y, 1.5, f.c, 'c'); }
  ctx.globalAlpha = 1;
}
function drawParts(ui) {
  for (const q of parts) {
    if (!!q.ui !== ui) continue;
    ctx.globalAlpha = Math.min(1, q.life / q.max * 1.5);
    if (q.kind === 'heart') heart(q.x, q.y, q.c, false);

      ctx.textBaseline = 'middle'; ctx.fillText(q.ch, Math.round(q.x - 4), Math.round(q.y));
    } else pix(q.x, q.y, q.c);
  }
  ctx.globalAlpha = 1;
}
/* pixel heart outline (classic heart curve) */
function heartRing(cx, cy, s, n) {
  for (let i = 0; i < n; i++) {
    const t = i / n * Math.PI * 2, sx = Math.sin(t);
    const fx = 16 * sx * sx * sx, fy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pix(cx + fx * s, cy - fy * s, '#ff3b6b');
    pix(cx + fx * s * .93, cy - fy * s * .93, '#ffb3c8');
  }
}
/* camera: zooms in on the couple during the kiss */
function camera() {
  const ox = W / 2, oy = H / 2 + 6;
  if ((state === 'fall' || state === 'over') && scn.kiss > 0) {
    const e = Math.min(1, scn.kiss / .9), ez = e * e * (3 - 2 * e), z = 1 + .8 * ez;
    const cx = clamp(G.x + (TR ? 22 : 15), W / (2 * z), W - W / (2 * z));
    const cy = clamp(G.y + 15, oy / z, H - (H - oy) / z);
    return { z, ox, oy, lx: ox + (cx - ox) * ez, ly: oy + (cy - oy) * ez };
  }
  return { z: 1, ox, oy, lx: ox, ly: oy };
}
const camPt = (x, y) => [(x - cam.lx) * cam.z + cam.ox, (y - cam.ly) * cam.z + cam.oy];
function drawTalk() {
  if (!talk) return;
  const show = (s, x, y, col, name) => { const [sx, sy] = camPt(x, y); drawBubble(s, sx, sy, col, name, 30 * cam.z); };
  if (talk.who === 'g') show(talk.s, G.x + 9, G.y, '#c8102e', 'HER');
  else if (talk.who === 't' && TR) show(talk.s, TR.x + 8, TR.y, '#1f2a4d', 'TRUMP');
  else if (talk.who === 'j') show(talk.s, P.x + 8, P.y, '#222222', 'JENSEN');
}

}

function draw() {
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (state === 'title') { drawTitle(); return; }
  cam = camera();
  ctx.save();
  if (shake > 0) ctx.translate(Math.round(rand(-shake, shake)), Math.round(rand(-shake, shake)));
  ctx.translate(cam.ox, cam.oy); ctx.scale(cam.z, cam.z); ctx.translate(-cam.lx, -cam.ly);
  scene();
  ctx.restore();
  if (scn.flash > 0) { ctx.fillStyle = `rgba(255,140,185,${Math.min(.75, scn.flash * 2.2)})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  if (state === 'fall' && !scn.kiss && Math.floor(clock * 6) % 2) txt('TRAPPED!', W / 2, 30, 4, '#ff3b6b', 'c', '#3a0d26');
  if (state === 'fall' && scn.kiss > 0 && scn.kiss < 2.5) txt('▼8%', W - 5, H - 22, 1.5, '#ff5a6a', 'r');
  if (state === 'play' && t < 2.5) txt('DODGE THE LOVE ARROWS!', W / 2, 40, 2, '#ffe27a', 'c');
  if (state === 'play' && level > 1 && t % 15 < 1.5) txt('LEVEL ' + level + '!', W / 2, 40, 2, '#ff9ec4', 'c');
  if (state === 'play' && banner && Math.floor(clock * 8) % 2) txt(banner.s, W / 2, 58, 2, '#ffe592', 'c');
  if (state !== 'over') drawTalk();
  if (state === 'pause') { dim(.6); txt('PAUSED', W / 2, 75, 3, '#ffffff', 'c'); txt('PRESS P OR TAP TO RESUME', W / 2, 100, 1, '#c9b8ff', 'c'); }
  if (state === 'over') drawOver();
}

let last = null;
function loop(now) {
  // the first rAF timestamp can be earlier than performance.now() at load, so never allow a negative step
  const dt = last === null ? 0 : clamp((now - last) / 1000, 0, .05); last = now;
  try { update(dt); draw(); } catch (e) { console.error(e); }   // a bad frame must never kill the loop
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
